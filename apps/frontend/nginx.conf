server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS resolves the Compose service at request time, so
  # this container can start before the backend service is available.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $backend_upstream backend:3000;

  # VITE_API_BASE_URL defaults to /api during the image build. Keeping this
  # proxy same-origin avoids exposing an internal backend address to browsers.
  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|woff2?|svg|png|jpe?g|gif|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
