services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - flexi_postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrations:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migrations
    restart: 'no'
    environment: &backend-environment
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SMTP_ENABLED: 'true'
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      SETUP_ACCOUNT_URL_BASE: ${SETUP_ACCOUNT_URL_BASE:?SETUP_ACCOUNT_URL_BASE is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - app
      - data

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FRONTEND_PORT:?FRONTEND_PORT is required}:8080'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

volumes:
  flexi_postgres_data:

networks:
  app:
  data:
    internal: true
